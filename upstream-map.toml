# Row names are exact UPSTREAM.md cells; paths use case-sensitive fnmatch (* includes /).
# Each own-design area names its upstream feature and the gap it fills.
[areas]
"meridian/__init__.py" = { upstream = "NautilusTrader", how = "integrate", feature = "Python package", why = "the harness needs its own namespace" }
"meridian/boundary.py" = { upstream = "NautilusTrader IB integration guide and reconciliation concept", how = "build-on", feature = "paper Gateway configuration", why = "the lane must verify paper state before constructing the engine" }
"meridian/ib_probe.py" = { upstream = "IBKR Python API client source, read as text and not installed", how = "build-on", feature = "managed-accounts handshake", why = "the engine adapter trusts the configured account" }
"meridian/ibkr_node.py" = { upstream = "`upstream/.../interactive_brokers/ib_v2_order_strategies.py`", how = "build-on", feature = "IbV2OrderStrategy", why = "the attended lane needs bounded order and fill proofs" }
"meridian/ibkr_paper.py" = { upstream = "NautilusTrader", how = "build-on", feature = "IB node and reconciliation", why = "owner confirmation and scrubbed records are harness policy" }
"meridian/sandbox_*.py" = { upstream = "Upstream example `examples/live/sandbox/exec_tester.py` (read, not copied)", how = "build-on", feature = "simulated execution with ExecTester", why = "the lane needs IB data and the paper gate" }
"meridian/order_budget/*" = { upstream = "NautilusTrader's own order rate limits (read, not set here)", how = "build-on", feature = "execution request admission", why = "engine limits do not queue cancels and queries under one budget" }
# Standalone screener/universe modules use their own provenance below.
"meridian/alpaca/[!su]*.py" = { upstream = "NautilusTrader Python adapter interface", how = "build-on", feature = "execution and market-data client hooks", why = "the engine needs an Alpaca paper adapter" }
"meridian/alpaca/screener*.py" = { upstream = "Alpaca stock screeners, request/model pattern", how = "build-on", feature = "ScreenerClient stock list requests and response models", why = "the harness needs pinned paced reads and validated receipt times" }
"meridian/alpaca/universe.py" = { upstream = "Alpaca stock screeners, request/model pattern", how = "build-on", feature = "SIP mover prices and cumulative daily activity", why = "venue lists need lane eligibility, owner filters and receipt-time membership" }
"meridian/alpaca_lane.py" = { upstream = "NautilusTrader", how = "build-on", feature = "live node and reconciliation", why = "owner confirmation and scrubbed records are harness policy" }
"meridian/alpaca_node.py" = { upstream = "NautilusTrader Python adapter interface", how = "build-on", feature = "client factories and node configuration", why = "the node must wire the paper adapter and bounded strategy" }
"meridian/alpaca_strategy.py" = { upstream = "`upstream/.../interactive_brokers/ib_v2_order_strategies.py`", how = "build-on", feature = "once-only quote trigger and DAY LIMIT helper", why = "the strategy needs Alpaca instruments and the lane record" }
"meridian/alpaca_sim.py" = { upstream = "NautilusTrader native `BacktestEngine`, cash simulated venue and `StaticLatencyModel`", how = "build-on", feature = "synthetic backtest and native latency", why = "the offline proof needs the lane strategy and run record" }
"meridian/alpaca_unattended.py" = { upstream = "NautilusTrader", how = "build-on", feature = "live node run, through the lane's node", why = "standing consent, the hold file and the session gate are harness policy" }
"meridian/alpaca_sessions.py" = { upstream = "Alpaca 24/5 sessions and free overnight data", how = "build-on", feature = "New York session windows and calendar rules", why = "the lane needs shared scheduling and order-admission decisions" }
"meridian/sim/*" = { upstream = "NautilusTrader `BacktestNode`, `ParquetDataCatalog`, `InstrumentStatus`, venue models (`DefaultFillModel`, `FixedFeeModel`, `StaticLatencyModel`), `RiskEngineConfig` throttle, `OrderFactory.bracket` and the tearsheet (nothing new installed)", how = "build-on", feature = "high-level backtest node, catalog, venue models and analysis", why = "the engine has no exchange calendar or extended-hours order rule" }
"meridian/strategy_template/__init__.py" = { upstream = "Upstream example `EMACrossTrailingStop` (read, not copied), the engine's `OrderEmulator`, `TRAILING_STOP_LIMIT` and `AverageTrueRange` (nothing new installed)", how = "build-on", feature = "EMACrossTrailingStop pattern, OrderEmulator and TRAILING_STOP_LIMIT", why = "the template needs many symbols, quote-driven ATR and re-entry rules" }
"meridian/strategy_template/actions.py" = { upstream = "Upstream example `EMACrossTrailingStop` (read, not copied), the engine's `OrderEmulator`, `TRAILING_STOP_LIMIT` and `AverageTrueRange` (nothing new installed)", how = "build-on", feature = "EMACrossTrailingStop pattern, OrderEmulator and TRAILING_STOP_LIMIT", why = "the template needs many symbols, quote-driven ATR and re-entry rules" }
"meridian/strategy_template/params.py" = { upstream = "Upstream example `EMACrossTrailingStop` (read, not copied), the engine's `OrderEmulator`, `TRAILING_STOP_LIMIT` and `AverageTrueRange` (nothing new installed)", how = "build-on", feature = "EMACrossTrailingStop pattern, OrderEmulator and TRAILING_STOP_LIMIT", why = "the template needs many symbols, quote-driven ATR and re-entry rules" }
"meridian/strategy_template/strategy.py" = { upstream = "Upstream example `EMACrossTrailingStop` (read, not copied), the engine's `OrderEmulator`, `TRAILING_STOP_LIMIT` and `AverageTrueRange` (nothing new installed)", how = "build-on", feature = "EMACrossTrailingStop pattern, OrderEmulator and TRAILING_STOP_LIMIT", why = "the template needs many symbols, quote-driven ATR and re-entry rules" }
"meridian/strategy_template/sim.py" = { upstream = "NautilusTrader native `BacktestEngine`, cash simulated venue and `StaticLatencyModel`", how = "build-on", feature = "synthetic backtest on a cash simulated venue", why = "the template needs offline behavior scenarios and an optional engine report" }
"meridian/strategy_template/report.py" = { upstream = "NautilusTrader analyzer, ReportProvider and Plotly tearsheet", how = "integrate", feature = "BacktestResult statistics, native CSV reports and create_tearsheet", why = "the template needs one report command with artifacts confined to runs and missing-dependency guidance" }
"deploy/alpaca-lane.template.json" = { upstream = "NautilusTrader", how = "integrate", feature = "node and strategy settings", why = "the owner supplies lane settings separately from code" }
"deploy/alpaca-universe.template.json" = { upstream = "Alpaca stock screeners, request/model pattern", how = "build-on", feature = "mover price and most-actives volume fields", why = "the owner supplies universe floors, count cap and freshness policy outside code" }
"deploy/alpaca-order-budget.template.json" = { upstream = "Alpaca Trading API rate limit", how = "build-on", feature = "per-account request ceiling", why = "the owner must supply reviewed pacing controls" }
"deploy/systemd/*.service" = { upstream = "systemd credentials (`LoadCredentialEncrypted=`, `systemd-creds`, `systemd-ask-password`)", how = "integrate", feature = "service credentials", why = "the lane needs a dedicated paper service definition" }
"deploy/systemd/*.timer" = { upstream = "systemd timers and unit directories (`OnCalendar=`, `StateDirectory=`, `ConfigurationDirectory=`, `systemctl add-wants`)", how = "integrate", feature = "calendar timers", why = "the unattended lane runs restart and order on a New York schedule" }
"deploy/wsl/meridian.user-data" = { upstream = "cloud-init, WSL datasource", how = "integrate", feature = "first-boot distro configuration", why = "the image needs the harness users and settings" }
"deploy/wsl/setup.sh" = { upstream = "Ubuntu WSL image", how = "install", feature = "user-level tool installation", why = "the distro needs the register's pinned tools and checks" }
"deploy/wsl/meridian-claude-hud.sh" = { upstream = "jarrodwatts/claude-hud (Claude Code plugin, status line)", how = "build-on", feature = "statusline.mjs rendering of Claude Code status JSON", why = "one status command must feed Orca's usage reporter and display the HUD with a fallback" }
"deploy/wsl/dsh-check-gate.sh" = { upstream = "DeepSeek Harness hook packages", how = "build-on", feature = "Stop hook through dsh-hooks-claude-code", why = "a dsh worker must meet the check line before it stops, and the bridge has no block cap" }
"deploy/wsl/dsh-lsp-root.py" = { upstream = "DeepSeek Harness LSP packages `@deepseek-ai/dsh-lsp`, `dsh-lsp-stdio`, `dsh-tool-lsp`", how = "build-on", feature = "dsh-lsp-stdio server launch", why = "the provider gives pyright the session directory as its root, so a subdirectory resolves no imports" }
"deploy/landscape_*.py" = { upstream = "GitHub REST API", how = "build-on", feature = "repository, release, starred-repository, issue and label endpoints", why = "the harness needs its own revisit rules and a consolidated watch issue" }

"deploy/wsl/meridian-omc.py" = { upstream = "oh-my-claudecode", how = "build-on", feature = "standalone lifecycle skills and hook events", why = "Meridian needs a bounded user install, reversible removal, owner/Orca stop precedence and notice-only filtering" }

# Only differently named rows need aliases; package labels are normalized automatically.
[dependencies]
nautilus-trader = "NautilusTrader"
pyright = "pyright (with `nodejs-wheel-binaries` 24.19.0)"
